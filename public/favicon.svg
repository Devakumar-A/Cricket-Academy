<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    
    <!-- Deep Cricket Midnight Turf Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061811" />
      <stop offset="100%" stop-color="#020906" />
    </linearGradient>

    <!-- Vibrant Red Cricket Ball Gradient -->
    <radialGradient id="ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
  </defs>

  <!-- High-contrast squircle badge (stands out on both dark & light backgrounds) -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.2" />

  <!-- Letter M (Athletic Cut) -->
  <path d="M 5.5 36 L 5.5 12 L 10 12 L 14 21.5 L 18 12 L 22.5 12 L 22.5 36 L 18.5 36 L 18.5 18.5 L 15.5 25.5 L 12.5 25.5 L 9.5 18.5 L 9.5 36 Z" fill="url(#gold)" />

  <!-- Letter G (Athletic Cut) -->
  <path d="M 42.5 17 L 38.5 19 C 37.5 17 36 15.5 34 15.5 C 31 15.5 29 18.5 29 24 C 29 29.5 31 32.5 34 32.5 C 36.5 32.5 38 31 38.5 28 L 34.5 28 L 34.5 24.5 L 43 24.5 L 43 30 C 41 34.2 38 36 34 36 C 27.5 36 24.5 31 24.5 24 C 24.5 17 27.5 12 34 12 C 38 12 41 14.5 42.5 17 Z" fill="url(#gold)" />

  <!-- Cricket Ball in G counter (Crimson with White Stitched Seam) -->
  <circle cx="34.5" cy="20" r="3.6" fill="url(#ball)" stroke="#FFFFFF" stroke-width="0.6" />
  <path d="M 32 18 Q 34.5 20 37 22" stroke="#FFFFFF" stroke-width="0.75" stroke-linecap="round" stroke-dasharray="0.8 0.8" fill="none" />
</svg>