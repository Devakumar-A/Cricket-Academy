<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- VIDEO VAULT / APERTURE EMBLEM -->
  <g transform="translate(20, 15)">
    <circle cx="35" cy="35" r="30" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" />
    <polygon points="28,23 48,35 28,47" fill="url(#cyanGrad2)"/>
    <circle cx="35" cy="35" r="14" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>
  <!-- BRAND NAME: VISUOREXVAULT -->
  <text x="105" y="52" font-family="'Outfit', 'Segoe UI', 'Montserrat', sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#ffffff">
    VISUOREX<tspan fill="url(#purpleGrad)">VAULT</tspan>
  </text>
  <!-- SUBTITLE: VIDEO EDITING -->
  <text x="107" y="70" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#94a3b8">
    VIDEO EDITING & MEDIA
  </text>
</svg>
