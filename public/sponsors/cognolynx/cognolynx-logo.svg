<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LYNX / COGNITIVE GEOMETRIC EMBLEM -->
  <g transform="translate(20, 15)">
    <!-- Hexagonal / Lynx Ear Neural Shield -->
    <path d="M35 5 L60 22 L60 52 L35 68 L10 52 L10 22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Inner Lynx Stylized Ears & Neural Nodes -->
    <path d="M22 24 L35 44 L48 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 24 L16 12 L28 18" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M48 24 L54 12 L42 18" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Core Node -->
    <circle cx="35" cy="44" r="3.5" fill="#fde047" filter="url(#glow)"/>
    <circle cx="16" cy="12" r="2" fill="#38bdf8"/>
    <circle cx="54" cy="12" r="2" fill="#38bdf8"/>
  </g>

  <!-- BRAND NAME: COGNOLYNX -->
  <text x="105" y="52" font-family="'Outfit', 'Segoe UI', 'Montserrat', sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#ffffff">
    COGNO<tspan fill="url(#goldGrad)">LYNX</tspan>
  </text>

  <!-- SUBTITLE: OFFICIAL TECHNOLOGY PARTNER -->
  <text x="107" y="70" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#94a3b8">
    OFFICIAL TECHNOLOGY PARTNER
  </text>
</svg>
